name: Daily Pauper Metagame Sync

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 PM PDT / 2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Metagame Scraper
        run: |
          xvfb-run --auto-servernum python scripts/update_meta.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/top_decks.json
          git diff --staged --quiet || (git commit -m "chore(data): daily pauper metagame sync [skip ci]" && git push)
