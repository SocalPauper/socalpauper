name: Weekly Pauper Metagame Sync

on:
  schedule:
    # Runs every Monday at 06:00 UTC (Sunday 11:00 PM PDT)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows GitHub Actions to push top_decks.json back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Run Metagame Scraper
        run: |
          python scripts/update_meta.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/top_decks.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-update top pauper decks [skip ci]" && git push)