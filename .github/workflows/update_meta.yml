name: Daily Pauper Metagame Sync

on:
  schedule:
    # Runs once every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Metagame Scraper
        run: |
          python scripts/update_meta.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/top_decks.json
          git diff --staged --quiet || (git commit -m "chore(data): daily pauper metagame sync [skip ci]" && git push)
